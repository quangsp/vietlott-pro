name: Auto Update Vietlott Data

on:
  schedule:
    - cron: '45 18 * * *'  # Chạy tự động mỗi ngày (khoảng 1h45 sáng giờ VN)
  workflow_dispatch:      # Cho phép bạn bấm nút chạy thủ công bất cứ lúc nào

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run update script
        run: python update_bot.py

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Auto Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data.json
          git commit -m "🤖 Tự động cập nhật kết quả xổ số mới [skip ci]" || exit 0
          git push
